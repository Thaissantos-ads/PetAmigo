  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsivo.css">
</head>
<body>

  <!-- ===== Cabeçalho ===== -->
  <header class="cabecalho">
    <div class="container">
      <a href="../index.html" class="logo" aria-label="PetAmigo - página inicial">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="32" cy="32" r="32" fill="#f28c28"/>
          <ellipse cx="32" cy="42" rx="12" ry="10" fill="#fff"/>
          <ellipse cx="17" cy="30" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="27" cy="20" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="37" cy="20" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="47" cy="30" rx="5" ry="7" fill="#fff"/>
        </svg>
        <strong>Pet<span>Amigo</span></strong>
      </a>
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav>
        <ul class="menu">
          <li><a href="../index.html">Início</a></li>
          <li><a href="adocao.html">Adoção</a></li>
          <li><a href="mapa.html">Mapa</a></li>
          <li><a href="galeria.html">Galeria</a></li>
          <li><a href="contato.html" class="ativo">Contato</a></li>
          <li><a href="entrar.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="topo-pagina">
      <div class="container">
        <h1>Fale com a gente</h1>
        <p>Tire dúvidas sobre adoção, visitas e parcerias.</p>
      </div>
    </section>

    <section class="area-formulario">
      <div class="container">
        <div class="card caixa-formulario">

          <form id="form-contato" novalidate>

            <div class="campo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
              <small class="erro" id="erro-nome"></small>
            </div>

            <div class="campo">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
              <small class="erro" id="erro-email"></small>
            </div>

            <div class="campo">
              <label for="assunto">Assunto</label>
              <select id="assunto" name="assunto">
                <option value="">Selecione...</option>
                <option value="adocao">Quero adotar</option>
                <option value="visita">Agendar visita</option>
                <option value="parceria">Parcerias</option>
                <option value="outro">Outro assunto</option>
              </select>
              <small class="erro" id="erro-assunto"></small>
            </div>

            <div class="campo">
              <label for="mensagem">Mensagem</label>
              <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem (mínimo 10 caracteres)"></textarea>
              <small class="erro" id="erro-mensagem"></small>
            </div>

            <button type="submit" class="btn btn-primario btn-largo">Enviar mensagem</button>

            <p class="mensagem-sucesso" id="mensagem-sucesso" hidden>
              ✅ Mensagem enviada! Responderemos em breve.
            </p>

          </form>

        </div>
      </div>
    </section>

  </main>

  <!-- ===== Rodapé ===== -->
  <footer class="rodape">
    <div class="container">
      <p>&copy; 2026 PetAmigo. Projeto da disciplina Desenvolvimento Front-End para Web.</p>
    </div>
  </footer>

  <script src="../js/validacao.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
