    <div class="container">
      <a href="../index.html" class="logo" aria-label="PetAmigo - página inicial">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="32" cy="32" r="32" fill="#f28c28"/>
          <ellipse cx="32" cy="42" rx="12" ry="10" fill="#fff"/>
          <ellipse cx="17" cy="30" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="27" cy="20" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="37" cy="20" rx="5" ry="7" fill="#fff"/>
          <ellipse cx="47" cy="30" rx="5" ry="7" fill="#fff"/>
        </svg>
        <strong>Pet<span>Amigo</span></strong>
      </a>
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav>
        <ul class="menu">
          <li><a href="../index.html">Início</a></li>
          <li><a href="adocao.html">Adoção</a></li>
          <li><a href="mapa.html" class="ativo">Mapa</a></li>

          <li><a href="entrar.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="topo-pagina">
      <div class="container">
        <h1>Mapa de apoio</h1>
        <p>Clínicas veterinárias e petshops parceiros.</p>
      </div>
    </section>

    <section class="area-mapa">
      <div class="container mapa-grade">

        <div class="mapa-lista">
          <div class="botoes-filtro">
            <button class="btn-filtro ativo" data-tipo="todos">Todos</button>
            <button class="btn-filtro" data-tipo="clinica">Clínicas</button>
            <button class="btn-filtro" data-tipo="petshop">Petshops</button>
          </div>

          <ul class="lista-locais" id="lista-locais">
            <li>
              <button class="local-btn" data-tipo="clinica" data-busca="Avenida Paulista, São Paulo">
                <strong>🏥 Clínica Vet Paulista</strong>
                <span>Av. Paulista, São Paulo - SP</span>
                <small>Seg a sáb, 8h às 20h</small>
              </button>
            </li>
            <li>
              <button class="local-btn" data-tipo="petshop" data-busca="Parque Ibirapuera, São Paulo">
                <strong>🛍️ Petshop Amigo Fiel</strong>
                <span>Próximo ao Parque Ibirapuera, São Paulo - SP</span>
                <small>Todos os dias, 9h às 19h</small>
              </button>
            </li>
            <li>
              <button class="local-btn" data-tipo="clinica" data-busca="Vila Madalena, São Paulo">
                <strong>🏥 Clínica Patinhas</strong>
                <span>Vila Madalena, São Paulo - SP</span>
                <small>Plantão 24 horas</small>
              </button>
            </li>
            <li>
              <button class="local-btn" data-tipo="petshop" data-busca="Pinheiros, São Paulo">
                <strong>🛍️ Petshop Bicho Feliz</strong>
                <span>Pinheiros, São Paulo - SP</span>
                <small>Seg a sex, 9h às 18h</small>
              </button>
            </li>
          </ul>
        </div>

        <div class="mapa-caixa">
          <iframe
            id="mapa-frame"
            title="Mapa com a localização do ponto selecionado"
            src="https://www.google.com/maps?q=Avenida+Paulista,+São+Paulo&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

      </div>
    </section>

  </main>

  <!-- ===== Rodapé ===== -->
